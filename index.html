<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC.CN 我的世界服务器 - 官方网站</title>
    <script>
        if (!document.cookie.split('; ').some(function (c) { return c.indexOf('mc_verified=1') === 0; })) {
            window.location.replace('./verify.html');
        }
    </script>
    <style>
        :root {
            --bg-start: #d9e2ec;
            --bg-end: #f1f5f9;
            --glass: rgba(255,255,255,0.4);
            --glass-hover: rgba(255,255,255,0.55);
            --glass-border: rgba(255,255,255,0.6);
            --text: #1e293b;
            --text2: #475569;
            --accent: #0067c0;
            --accent-hover: #1975c4;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
            --radius: 24px;
            --transition: 0.3s cubic-bezier(0.2,0,0,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { background: rgba(255,255,255,0.7); top: -120px; left: -120px; }
        body::after { background: rgba(56,189,248,0.3); bottom: -150px; right: -100px; }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }
        .logo { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.5px; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
        .logo .cn { color: var(--accent); }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            transition: background var(--transition);
            background: rgba(255,255,255,0.1);
            border: 1px solid transparent;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.4); text-decoration: none; border-color: rgba(255,255,255,0.6); }
        .nav-links a.active { background: rgba(255,255,255,0.5); color: var(--accent); border-color: rgba(255,255,255,0.8); }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; flex: 1; width: 100%; position: relative; z-index: 1; }
        .hero { text-align: center; padding: 60px 0 30px; }
        .hero h1 { font-size: 3.4rem; font-weight: 600; letter-spacing: -1px; margin-bottom: 12px; text-shadow: 0 2px 4px rgba(255,255,255,0.8); }
        .hero p { font-size: 1.2rem; color: var(--text2); margin-bottom: 24px; }
        .domain-hero {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 700px;
            margin: 0 auto 30px;
            box-shadow: var(--shadow);
        }
        .domain-hero h2 { font-size: 1.6rem; font-weight: 600; margin-bottom: 10px; }
        .domain-hero .domain { font-size: 2.4rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
        .domain-hero p { color: var(--text2); margin-top: 8px; }
        .ip-box {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: var(--shadow);
        }
        .ip { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
        .copy-btn { background: var(--accent); border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: background var(--transition); }
        .copy-btn:hover { background: var(--accent-hover); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin: 40px 0; }
        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); background: var(--glass-hover); }
        .stat-card h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
        .stat-card p { color: var(--text2); font-size: 0.9rem; }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            transition: background var(--transition), transform var(--transition);
            text-decoration: none;
        }
        .btn:hover { background: var(--accent-hover); text-decoration: none; transform: translateY(-2px); }

        footer {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.5);
            padding: 20px 24px;
            text-align: center;
            color: var(--text2);
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        footer a { color: var(--text2); }
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.4rem; }
            .nav-links a { padding: 6px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">

            <nav class="nav-links">

                <a href="./mods.html">整合包介绍</a>

            </div>
            <div class="stat-card">

            </div>
            <div class="stat-card">

        </section>

        <section style="text-align: center; margin: 40px 0;">
            <a href="./download.html" class="btn">📥 下载客户端整合包</a>
            <a href="./about.html" class="btn" style="margin-left: 12px;">🖥️ 了解服务器</a>
        </section>
    </main>

    <footer>
        <p>© 2026 MC.CN 我的世界服务器</p>
        <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026083233号-2</a></p>
    </footer>

    <script src="./ads_enabled.js"></script>
    <script src="./ads.js"></script>
    <script>
        function copyIP() {
            navigator.clipboard.writeText("mc.cn").then(() => alert("IP 已复制"));

</body>
</html>
