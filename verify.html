<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证 - MC.CN 网络信息服务中心</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span>欢迎访问 MC.CN 网络信息服务中心</span>
            <span>
                <a href="https://www.gov.cn/" target="_blank" rel="noopener">中国政府网</a>
                <a href="https://www.people.com.cn/" target="_blank" rel="noopener">人民网</a>
                <a href="https://www.news.cn/" target="_blank" rel="noopener">新华网</a>
            </span>
        </div>
    </div>

    <main class="verify-wrap">
        <div class="verify-card">
            <h1>安全验证</h1>
            <p class="subtitle">请选择所有包含 <strong>红绿灯</strong> 的图片区块，验证通过后还需等待 20 秒。</p>
            <div class="captcha-grid" id="captchaGrid"></div>
            <p class="error-msg" id="errorMsg"></p>
            <p class="success-msg" id="successMsg"></p>
            <button class="btn" id="verifyBtn" onclick="checkAnswer()">验 证</button>
            <p class="wait-msg" id="waitMsg"></p>
            <p style="margin-top:14px; font-size:0.82rem; color:#888;">验证通过后将自动进入 MC.CN 网络信息服务中心官方网站。</p>
        </div>
    </main>

    <footer class="footer">
        <p>版权所有 © 2026 MC.CN 网络信息服务中心　保留所有权利</p>
        <p class="beian">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026083233号-2</a>
        </p>
    </footer>

    <script>
        var CAPTCHA_IMAGE = './images/captcha-street.webp';
        var CORRECT_CELLS = [0, 2, 4, 7];
        var selectedIndices = new Set();
        var verified = false;
        var timerRemaining = 20;
        var timerInterval = null;
        var lockInput = false;

        function initCaptcha() {
            var grid = document.getElementById('captchaGrid');
            grid.innerHTML = '';
            selectedIndices.clear();
            verified = false;
            lockInput = false;
            timerRemaining = 20;
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('successMsg').textContent = '';
            document.getElementById('waitMsg').textContent = '';
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = '验 证';

            for (var i = 0; i < 9; i++) {
                var cell = document.createElement('div');
                cell.className = 'captcha-cell';
                cell.dataset.index = i;
                var row = Math.floor(i / 3);
                var col = i % 3;
                cell.style.backgroundImage = 'url("' + CAPTCHA_IMAGE + '")';
                cell.style.backgroundSize = '300% 300%';
                cell.style.backgroundPosition = (col * 50) + '% ' + (row * 50) + '%';
                cell.addEventListener('click', function () {
                    toggleCell(this);
                });
                grid.appendChild(cell);
            }
        }

        function toggleCell(cell) {
            if (lockInput) return;
            var idx = parseInt(cell.dataset.index, 10);
            if (selectedIndices.has(idx)) {
                selectedIndices.delete(idx);
                cell.classList.remove('selected');
            } else {
                selectedIndices.add(idx);
                cell.classList.add('selected');
            }
        }

        function checkAnswer() {
            if (lockInput) return;
            if (selectedIndices.size === 0) {
                document.getElementById('errorMsg').textContent = '请先选择图片区块';
                return;
            }

            var isCorrect = selectedIndices.size === CORRECT_CELLS.length &&
                CORRECT_CELLS.every(function (idx) { return selectedIndices.has(idx); });

            if (isCorrect) {
                verified = true;
                document.getElementById('errorMsg').textContent = '';
                document.getElementById('successMsg').textContent = '✅ 验证通过！请等待 20 秒后自动进入...';
                document.getElementById('verifyBtn').disabled = true;
                lockInput = true;
                document.getElementById('waitMsg').textContent = '正在等待时间结束...';
                startTimer();
            } else {
                document.getElementById('errorMsg').textContent = '❌ 验证失败，请重新选择';
                document.getElementById('successMsg').textContent = '';
                lockInput = true;
                setTimeout(function () {
                    selectedIndices.clear();
                    document.querySelectorAll('.captcha-cell.selected').forEach(function (cell) {
                        cell.classList.remove('selected');
                    });
                    lockInput = false;
                }, 800);
            }
        }

        function startTimer() {
            timerInterval = setInterval(function () {
                timerRemaining--;
                document.getElementById('waitMsg').textContent = '验证已通过，还需等待 ' + timerRemaining + ' 秒...';
                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('waitMsg').textContent = '验证完成，正在进入...';
                    document.cookie = "mc_verified=1; path=/; max-age=86400";
                    setTimeout(function () {
                        window.location.href = './index.html';
                    }, 500);
                }
            }, 1000);
        }

        initCaptcha();
    </script>
</body>
</html>
