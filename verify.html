<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证 - MC.CN</title>
    <style>
        :root {
            --bg-start: #d9e2ec;
            --bg-end: #f1f5f9;
            --glass: rgba(255,255,255,0.4);
            --glass-border: rgba(255,255,255,0.6);
            --text: #1e293b;
            --text2: #475569;
            --accent: #0067c0;
            --red: #d93025;
            --green: #188038;
            --radius: 24px;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { background: rgba(255,255,255,0.7); top: -100px; left: -100px; }
        body::after { background: rgba(56,189,248,0.3); bottom: -150px; right: -100px; }
        .verify-card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            max-width: 480px;
            width: 92%;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
        .subtitle { color: var(--text2); font-size: 0.9rem; margin-bottom: 20px; }
        .timer-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .timer-box .time { color: var(--accent); font-size: 1.3rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.55);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 2.5rem;
            position: relative;
        }
        .cell:hover {
            background: rgba(255,255,255,0.75);
            transform: scale(1.03);
        }
        .cell.selected {
            border-color: var(--accent);
            background: rgba(0,103,192,0.15);
            box-shadow: 0 0 0 2px rgba(0,103,192,0.3);
        }
        .cell.selected::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 8px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
        }
        .cell.correct {
            border-color: var(--green);
            background: rgba(24,128,56,0.15);
        }
        .cell.wrong {
            border-color: var(--red);
            background: rgba(217,48,37,0.15);
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            width: 100%;
        }
        .btn:hover { background: #1975c4; }
        .btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .error-msg {
            color: var(--red);
            font-size: 0.9rem;
            margin-bottom: 12px;
            min-height: 20px;
        }
        .success-msg {
            color: var(--green);
            font-size: 0.9rem;
            margin-bottom: 12px;
            min-height: 20px;
        }
        .wait-msg {
            color: var(--text2);
            font-size: 0.85rem;
            margin-top: 12px;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text2);
        }
        footer a { color: var(--text2); }
    </style>
</head>
<body>
    <div class="verify-card">
        <h1>🔒 安全验证</h1>
        <p class="subtitle">请选择所有包含 <strong id="targetName">红绿灯</strong> 的图片，验证通过后还需等待 20 秒。</p>
        <div class="timer-box">
            ⏳ 剩余时间：<span class="time" id="timerDisplay">20</span> 秒
        </div>
        <div class="grid" id="grid"></div>
        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>
        <button class="btn" id="verifyBtn" onclick="checkAnswer()">验 证</button>
        <p class="wait-msg" id="waitMsg"></p>
        <footer>
            <p>© 2026 MC.CN 我的世界服务器</p>
            <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026083233号-2</a></p>
        </footer>
    </div>

    <script>
        // 图标库
        const icons = {
            '红绿灯': '🚦',
            '公交车': '🚌',
            '汽车': '🚗',
            '自行车': '🚲',
            '飞机': '✈️',
            '船': '🚢',
            '火车': '🚂',
            '摩托车': '🏍️',
            '狗': '🐕',
            '猫': '🐈',
            '鸟': '🐦',
            '鱼': '🐟'
        };

        const iconNames = Object.keys(icons);
        let targetName = iconNames[Math.floor(Math.random() * iconNames.length)];
        let correctIndices = [];
        let selectedIndices = new Set();
        let verified = false;
        let timerDone = false;
        let timerRemaining = 20;
        let timerInterval = null;
        let lockInput = false;

        function initGrid() {
            const grid = document.getElementById('grid');
            document.getElementById('targetName').textContent = targetName;
            grid.innerHTML = '';
            selectedIndices.clear();
            verified = false;
            timerDone = false;
            timerRemaining = 20;
            lockInput = false;
            document.getElementById('timerDisplay').textContent = '20';
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('successMsg').textContent = '';
            document.getElementById('waitMsg').textContent = '';
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = '验 证';

            const cellIcons = [];
            const totalCells = 9;
            const targetCount = Math.floor(Math.random() * 3) + 2;
            correctIndices = [];

            const allIndices = Array.from({length: totalCells}, (_, i) => i);
            for (let i = 0; i < targetCount; i++) {
                const idx = Math.floor(Math.random() * allIndices.length);
                correctIndices.push(allIndices[idx]);
                allIndices.splice(idx, 1);
            }

            for (let i = 0; i < totalCells; i++) {
                if (correctIndices.includes(i)) {
                    cellIcons.push(icons[targetName]);
                } else {
                    let otherIcons = iconNames.filter(n => n !== targetName);
                    cellIcons.push(icons[otherIcons[Math.floor(Math.random() * otherIcons.length)]]);
                }
            }

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = cellIcons[i];
                cell.dataset.index = i;
                cell.addEventListener('click', () => toggleCell(i, cell));
                grid.appendChild(cell);
            }
        }

        function toggleCell(index, cell) {
            if (lockInput) return;
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
                cell.classList.remove('selected');
            } else {
                selectedIndices.add(index);
                cell.classList.add('selected');
            }
        }

        function checkAnswer() {
            if (lockInput) return;
            if (selectedIndices.size === 0) {
                document.getElementById('errorMsg').textContent = '请先选择图片';
                return;
            }

            const isCorrect = selectedIndices.size === correctIndices.length &&
                correctIndices.every(idx => selectedIndices.has(idx));

            if (isCorrect) {
                verified = true;
                document.getElementById('errorMsg').textContent = '';
                document.getElementById('successMsg').textContent = '✅ 验证通过！请等待 20 秒后自动进入...';
                document.getElementById('verifyBtn').disabled = true;
                lockInput = true;
                document.getElementById('waitMsg').textContent = '正在等待时间结束...';
                startTimer();
            } else {
                document.getElementById('errorMsg').textContent = '❌ 验证失败，请重试';
                document.getElementById('successMsg').textContent = '';
                setTimeout(() => {
                    initGrid();
                }, 800);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerRemaining--;
                document.getElementById('timerDisplay').textContent = timerRemaining;
                document.getElementById('waitMsg').textContent = `验证已通过，还需等待 ${timerRemaining} 秒...`;

                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerDone = true;
                    document.getElementById('waitMsg').textContent = '验证完成，正在进入...';
                    document.cookie = "mc_verified=1; path=/; max-age=86400";
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 500);
                }
            }, 1000);
        }

        initGrid();
    </script>
</body>
</html>
