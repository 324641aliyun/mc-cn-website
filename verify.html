<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证 - MC.CN 网络信息服务中心</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span>欢迎访问 MC.CN 网络信息服务中心</span>
            <span>
                <a href="https://www.gov.cn/" target="_blank" rel="noopener">中国政府网</a>
                <a href="https://www.people.com.cn/" target="_blank" rel="noopener">人民网</a>
                <a href="https://www.news.cn/" target="_blank" rel="noopener">新华网</a>
            </span>
        </div>
    </div>

    <main class="verify-wrap">
        <div class="verify-card">
            <h1>安全验证</h1>
            <p class="subtitle">请选择所有包含 <strong id="targetName">红绿灯</strong> 的图片，验证通过后还需等待 20 秒。</p>
            <div class="timer-box">
                ⏳ 剩余时间：<span class="time" id="timerDisplay">20</span> 秒
            </div>
            <div class="grid" id="grid"></div>
            <p class="error-msg" id="errorMsg"></p>
            <p class="success-msg" id="successMsg"></p>
            <button class="btn" id="verifyBtn" onclick="checkAnswer()">验 证</button>
            <p class="wait-msg" id="waitMsg"></p>
            <p style="margin-top:16px; font-size:0.82rem; color:#888;">验证通过后将自动进入 MC.CN 网络信息服务中心官方网站。</p>
        </div>
    </main>

    <footer class="footer">
        <p>版权所有 © 2026 MC.CN 网络信息服务中心　保留所有权利</p>
        <p class="beian">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026083233号-2</a>
        </p>
    </footer>

    <script>
        // 图标库
        const icons = {
            '红绿灯': '🚦',
            '公交车': '🚌',
            '汽车': '🚗',
            '自行车': '🚲',
            '飞机': '✈️',
            '船': '🚢',
            '火车': '🚂',
            '摩托车': '🏍️',
            '狗': '🐕',
            '猫': '🐈',
            '鸟': '🐦',
            '鱼': '🐟'
        };

        const iconNames = Object.keys(icons);
        let targetName = iconNames[Math.floor(Math.random() * iconNames.length)];
        let correctIndices = [];
        let selectedIndices = new Set();
        let verified = false;
        let timerDone = false;
        let timerRemaining = 20;
        let timerInterval = null;
        let lockInput = false;

        function initGrid() {
            const grid = document.getElementById('grid');
            document.getElementById('targetName').textContent = targetName;
            grid.innerHTML = '';
            selectedIndices.clear();
            verified = false;
            timerDone = false;
            timerRemaining = 20;
            lockInput = false;
            document.getElementById('timerDisplay').textContent = '20';
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('successMsg').textContent = '';
            document.getElementById('waitMsg').textContent = '';
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = '验 证';

            const cellIcons = [];
            const totalCells = 9;
            const targetCount = Math.floor(Math.random() * 3) + 2;
            correctIndices = [];

            const allIndices = Array.from({length: totalCells}, (_, i) => i);
            for (let i = 0; i < targetCount; i++) {
                const idx = Math.floor(Math.random() * allIndices.length);
                correctIndices.push(allIndices[idx]);
                allIndices.splice(idx, 1);
            }

            for (let i = 0; i < totalCells; i++) {
                if (correctIndices.includes(i)) {
                    cellIcons.push(icons[targetName]);
                } else {
                    let otherIcons = iconNames.filter(n => n !== targetName);
                    cellIcons.push(icons[otherIcons[Math.floor(Math.random() * otherIcons.length)]]);
                }
            }

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = cellIcons[i];
                cell.dataset.index = i;
                cell.addEventListener('click', () => toggleCell(i, cell));
                grid.appendChild(cell);
            }
        }

        function toggleCell(index, cell) {
            if (lockInput) return;
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
                cell.classList.remove('selected');
            } else {
                selectedIndices.add(index);
                cell.classList.add('selected');
            }
        }

        function checkAnswer() {
            if (lockInput) return;
            if (selectedIndices.size === 0) {
                document.getElementById('errorMsg').textContent = '请先选择图片';
                return;
            }

            const isCorrect = selectedIndices.size === correctIndices.length &&
                correctIndices.every(idx => selectedIndices.has(idx));

            if (isCorrect) {
                verified = true;
                document.getElementById('errorMsg').textContent = '';
                document.getElementById('successMsg').textContent = '✅ 验证通过！请等待 20 秒后自动进入...';
                document.getElementById('verifyBtn').disabled = true;
                lockInput = true;
                document.getElementById('waitMsg').textContent = '正在等待时间结束...';
                startTimer();
            } else {
                document.getElementById('errorMsg').textContent = '❌ 验证失败，请重试';
                document.getElementById('successMsg').textContent = '';
                setTimeout(() => {
                    initGrid();
                }, 800);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerRemaining--;
                document.getElementById('timerDisplay').textContent = timerRemaining;
                document.getElementById('waitMsg').textContent = `验证已通过，还需等待 ${timerRemaining} 秒...`;

                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerDone = true;
                    document.getElementById('waitMsg').textContent = '验证完成，正在进入...';
                    document.cookie = "mc_verified=1; path=/; max-age=86400";
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 500);
                }
            }, 1000);
        }

        initGrid();
    </script>
</body>
</html>
